<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1O1V</title>
  
  <!-- Gouden Bolletje Favicon -->
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <style>
    /* Reset & Basisinstellingen */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      height: 100dvh;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    /* Container met Achtergrond (Standaard Mobiel) */
    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100%;
      min-height: 100dvh;
      padding: 35px 24px calc(30px + env(safe-area-inset-bottom)) 24px;
      background-image: url('assets/bg-mobile.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    @media (min-width: 768px) {
      .container {
        background-image: url('assets/bg-desktop.jpg');
        padding: 50px 30px 40px 30px;
      }
    }

    /* Header met geatropineerd Centraal Logo & Taalschakelaar */
    .header {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 5px;
    }

    .logo {
      height: 48px;
      width: auto;
      display: block;
    }

    @media (min-width: 768px) {
      .logo {
        height: 55px;
      }
    }

    /* Taalschakelaar los van de stroom (duwt het logo niet weg) */
    .lang-switch {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 0.8px;
    }

    .lang-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      padding: 2px 0;
      font-size: 11px;
      opacity: 0.55;
      transition: opacity 0.2s ease;
    }

    .lang-btn.active, .lang-btn:hover {
      opacity: 1;
      font-weight: 600;
      border-bottom: 1px solid #ffffff;
    }

    /* Midden Sectie (Formulier + Beschrijving) */
    .content-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 340px;
      margin: auto 0; /* Zorgt voor perfecte verticale centrering */
    }

    /* Introductietekst Boven of Onder */
    .intro-text {
      font-size: 13.5px;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: 0.2px;
      color: rgba(255, 255, 255, 0.92);
      text-align: center;
      margin-bottom: 35px; /* Ruime spatiëring tot het key-veld */
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 768px) {
      .intro-text {
        font-size: 14px;
        line-height: 1.7;
        margin-bottom: 40px;
      }
    }

    /* Input Sectie */
    .key-form {
      display: flex;
      align-items: center;
      width: 100%;
    }

    .key-label {
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.5px;
      margin-right: 15px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    }

    .key-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.8);
      color: #ffffff;
      font-size: 16px;
      padding: 6px 0;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .key-input:focus {
      border-bottom-color: #ffffff;
    }

    /* Adres onderaan */
    .footer-address {
      font-size: 12.5px;
      font-weight: 400;
      letter-spacing: 0.4px;
      color: rgba(255, 255, 255, 0.85);
      text-align: center;
      line-height: 1.5;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    .footer-address span {
      display: block;
    }

    @media (min-width: 768px) {
      .footer-address {
        font-size: 12px;
      }
      .footer-address span {
        display: inline;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Header: Logo strak in het midden, talen rechts -->
    <header class="header">
      <img src="1O1V-signage-light.png" alt="1O1V Logo" class="logo">
      <nav class="lang-switch">
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>
        <button class="lang-btn" onclick="setLanguage('fr')">FR</button>
        <button class="lang-btn" onclick="setLanguage('it')">IT</button>
        <button class="lang-btn" onclick="setLanguage('de')">DE</button>
        <button class="lang-btn" onclick="setLanguage('zh')">ZH</button>
      </nav>
    </header>

    <!-- Midden Content (Mooi gebalanceerd) -->
    <main class="content-center">
      <div class="intro-text" id="intro-text">
        <!-- Content wordt dynamisch geladen via JS -->
      </div>

      <form class="key-form" onsubmit="event.preventDefault();">
        <label for="key" id="key-label" class="key-label">key</label>
        <input type="password" id="key" name="key" class="key-input" autocomplete="off" autofocus>
      </form>
    </main>

    <!-- Footer Adres -->
    <footer class="footer-address" id="footer-address">
      <span>1O1V Bahnhofstraße 10,</span> <span>8001 Zürich, Switzerland</span>
    </footer>

  </div>

  <script>
    const translations = {
      en: {
        label: "key",
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 Zürich, Switzerland</span>",
        text: "1O1V is built to preserve and protect exceptional creativity and craftsmanship for verified collectors, behind a closed door."
      },
      fr: {
        label: "clé",
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 Zurich, Suisse</span>",
        text: "1O1V est conçu pour préserver et protéger une créativité et un savoir-faire d'exception pour des collectionneurs vérifiés, derrière une porte close."
      },
      it: {
        label: "chiave",
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 Zurigo, Svizzera</span>",
        text: "1O1V è nato per preservare e proteggere la creatività e la maestria artigianale d'eccezione per collezionisti verificati, a porte chiuse."
      },
      de: {
        label: "Schlüssel",
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 Zürich, Schweiz</span>",
        text: "1O1V wurde geschaffen, um außergewöhnliche Kreativität und Handwerkskunst für verifizierte Sammler hinter verschlossener Tür zu bewahren und zu schützen."
      },
      zh: {
        label: "密钥",
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 苏黎世, 瑞士</span>",
        text: "1O1V 旨在为经过验证的收藏家保护与传承非凡的创意与卓越工艺，尽在闭门之后。"
      }
    };

    function setLanguage(lang) {
      const data = translations[lang] || translations.en;
      
      document.getElementById('key-label').innerText = data.label;
      document.getElementById('intro-text').innerText = data.text;
      document.getElementById('footer-address').innerHTML = data.address;

      // Active state op taalknoppen
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase() === lang);
      });
    }

    // Automatische taaldetectie
    const userLang = (navigator.language || navigator.userLanguage).slice(0, 2).toLowerCase();
    setLanguage(translations[userLang] ? userLang : 'en');
  </script>

</body>
</html>
