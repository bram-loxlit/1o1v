<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1O1V</title>
  
  <!-- Gouden Bolletje Favicon (PNG) -->
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <style>
    /* Reset & Basisinstellingen */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      height: 100dvh;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    /* Container met Achtergrond (Standaard Mobiel) */
    .container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100%;
      min-height: 100dvh;
      padding: 40px 20px calc(40px + env(safe-area-inset-bottom)) 20px;
      background-image: url('assets/bg-mobile.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Desktop Achtergrond via Media Query */
    @media (min-width: 768px) {
      .container {
        background-image: url('assets/bg-desktop.jpg');
        padding: 60px 20px 40px 20px;
      }
    }

    /* Logo bovenaan */
    .logo-container {
      margin-top: 10px;
    }

    .logo {
      height: 55px;
      width: auto;
      display: block;
    }

    /* Input Sectie */
    .key-form {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 320px;
    }

    .key-label {
      font-size: 15px;
      font-weight: 300;
      letter-spacing: 0.8px;
      margin-right: 15px;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    }

    .key-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.7);
      color: #ffffff;
      font-size: 15px;
      letter-spacing: 1px;
      padding: 4px 0;
      line-height: 1.2;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .key-input:focus {
      border-bottom-color: #ffffff;
    }

    /* Foutmodus: Kleine letters, gecentreerd & geen verspringing */
    .key-input.error {
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.8px;
      text-align: center; /* Gecentreerd boven de lijn */
      text-transform: lowercase; /* Geen schreeuwende caps meer */
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    /* Adres onderaan - Geoptimaliseerd voor mobiel */
    .footer-address {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
      line-height: 1.6;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    .footer-address span {
      display: block; /* Op mobiel in 2 regels */
    }

    @media (min-width: 768px) {
      .footer-address {
        font-size: 12px;
      }
      .footer-address span {
        display: inline; /* Op desktop op 1 regel */
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Logo -->
    <div class="logo-container">
      <img src="1O1V-signage-light.png" alt="1O1V Logo" class="logo">
    </div>

    <!-- Input Veld -->
    <form class="key-form" id="keyForm">
      <label for="key" class="key-label">key</label>
      <input type="password" id="key" name="key" class="key-input" autocomplete="off" autofocus>
    </form>

    <!-- Footer Adres -->
    <div class="footer-address">
      <span>1O1V Bahnhofstraße 10,</span> <span>8001 Zürich, Switzerland</span>
    </div>

  </div>

  <script>
    const form = document.getElementById('keyForm');
    const input = document.getElementById('key');
    let isShowingError = false;

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      
      if (input.value.trim() !== '' && !isShowingError) {
        isShowingError = true;
        input.type = 'text';
        input.classList.add('error');
        input.value = 'access unauthorized';
        input.blur();
      }
    });

    // Reset direct zodra de gebruiker weer klikt of typt
    input.addEventListener('focus', resetInput);
    input.addEventListener('keydown', resetInput);

    function resetInput() {
      if (isShowingError) {
        isShowingError = false;
        input.value = '';
        input.type = 'password';
        input.classList.remove('error');
      }
    }
  </script>

</body>
</html>
