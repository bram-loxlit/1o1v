<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1O1V</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <style>
    /* Reset & Basisinstellingen */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      height: 100dvh;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    /* Container met Achtergrond */
    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100%;
      min-height: 100dvh;
      padding: 35px 24px calc(30px + env(safe-area-inset-bottom)) 24px;
      background-image: url('assets/bg-mobile.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    @media (min-width: 768px) {
      .container {
        background-image: url('assets/bg-desktop.jpg');
        padding: 40px 30px 40px 30px;
      }
    }

    /* Header: Logo strak gecentreerd */
    .header {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 5px;
    }

    /* Logo op desktop weer subtiel en klein */
    .logo {
      height: 38px;
      width: auto;
      display: block;
    }

    /* Subtiele Dropdown Rechtsboven */
    .lang-dropdown {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 11px;
      letter-spacing: 1px;
      outline: none;
      cursor: pointer;
      opacity: 0.75;
      padding: 2px 0;
      text-transform: uppercase;
    }

    .lang-dropdown option {
      background: #111111;
      color: #ffffff;
      font-size: 12px;
    }

    /* Midden Sectie */
    .content-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 340px;
      margin: auto 0;
    }

    /* Introductietekst (GEEN schaduw) */
    .intro-text {
      font-size: 13.5px;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: 0.2px;
      color: rgba(255, 255, 255, 0.92);
      text-align: center;
      margin-bottom: 35px;
    }

    @media (min-width: 768px) {
      .intro-text {
        font-size: 14px;
        line-height: 1.7;
      }
    }

    /* Input Sectie */
    .key-form {
      display: flex;
      align-items: center;
      width: 100%;
    }

    .key-label {
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.5px;
      margin-right: 15px;
      color: rgba(255, 255, 255, 0.9);
    }

    .key-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.8);
      color: #ffffff;
      font-size: 16px;
      padding: 6px 0;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .key-input:focus {
      border-bottom-color: #ffffff;
    }

    /* Adres onderaan (GEEN schaduw) */
    .footer-address {
      font-size: 12.5px;
      font-weight: 400;
      letter-spacing: 0.4px;
      color: rgba(255, 255, 255, 0.85);
      text-align: center;
      line-height: 1.5;
    }

    .footer-address span {
      display: block;
    }

    @media (min-width: 768px) {
      .footer-address {
        font-size: 12px;
      }
      .footer-address span {
        display: inline;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Header -->
    <header class="header">
      <img src="1O1V-signage-light.png" alt="1O1V Logo" class="logo">
      
      <!-- Dropdown Talen -->
      <select id="lang-select" class="lang-dropdown" onchange="setLanguage(this.value)">
        <option value="en">EN</option>
        <option value="fr">FR</option>
        <option value="it">IT</option>
        <option value="de">DE</option>
        <option value="es">ES</option>
        <option value="zh">ZH</option>
        <option value="ja">JA</option>
        <option value="ko">KO</option>
      </select>
    </header>

    <!-- Midden Content -->
    <main class="content-center">
      <div class="intro-text" id="intro-text">
        <!-- Dynamisch via JS -->
      </div>

      <form class="key-form" onsubmit="event.preventDefault();">
        <label for="key" id="key-label" class="key-label">key</label>
        <input type="password" id="key" name="key" class="key-input" autocomplete="off" autofocus>
      </form>
    </main>

    <!-- Footer Adres -->
    <footer class="footer-address" id="footer-address">
      <span>1O1V Bahnhofstraße 10,</span> <span>8001 Zürich, Switzerland</span>
    </footer>

  </div>

  <script>
    const translations = {
      en: {
        label: "key",
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 Zürich, Switzerland</span>",
        text: "1O1V is built to preserve and protect exceptional creativity and craftsmanship for verified collectors, behind a closed door."
      },
      fr: {
        label: "clé",
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 Zurich, Suisse</span>",
        text: "1O1V est conçu pour préserver et protéger une créativité et un savoir-faire d'exception pour des collectionneurs vérifiés, derrière une porte close."
      },
      it: {
        label: "chiave",
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 Zurigo, Svizzera</span>",
        text: "1O1V è nato per preservare e proteggere la creatività e la maestria artigianale d'eccezione per collezionisti verificati, a porte chiuse."
      },
      de: {
        label: "Schlüssel",
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 Zürich, Schweiz</span>",
        text: "1O1V wurde geschaffen, um außergewöhnliche Kreativität und Handwerkskunst für verifizierte Sammler hinter verschlossener Tür zu bewahren und zu schützen."
      },
      es: {
        label: "clave",
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 Zúrich, Suiza</span>",
        text: "1O1V está creado para preservar y proteger la creatividad y artesanía excepcionales para coleccionistas verificados, tras una puerta cerrada."
      },
      zh: {
        label: "密钥",
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 苏黎世, 瑞士</span>",
        text: "1O1V 旨在为经过验证的收藏家保护与传承非凡的创意与卓越工艺，尽在闭门之后。"
      },
      ja: {
        label: "キー",
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 チューリッヒ, スイス</span>",
        text: "1O1Vは、認証されたコレクターのために、非公開の場所で特別な創造性と職人技を保存・保護するために作られています。"
      },
      ko: {
        label: "키",
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 취리히, 스위스</span>",
        text: "1O1V는 검증된 수집가를 위해 닫힌 문 뒤에서 특별한 창의성과 장인 정신을 보존하고 보호하기 위해 설립되었습니다."
      }
    };

    function setLanguage(lang) {
      const data = translations[lang] || translations.en;
      
      document.getElementById('key-label').innerText = data.label;
      document.getElementById('intro-text').innerText = data.text;
      document.getElementById('footer-address').innerHTML = data.address;
      document.getElementById('lang-select').value = translations[lang] ? lang : 'en';
    }

    const userLang = (navigator.language || navigator.userLanguage).slice(0, 2).toLowerCase();
    setLanguage(translations[userLang] ? userLang : 'en');
  </script>

</body>
</html>
