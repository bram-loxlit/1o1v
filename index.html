<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1O1V</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <style>
    /* Reset & Basisinstellingen */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      height: 100dvh;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    /* Container met Achtergrond */
    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100%;
      min-height: 100dvh;
      padding: 40px 32px calc(35px + env(safe-area-inset-bottom)) 32px;
      background-image: url('assets/bg-mobile.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    @media (min-width: 768px) {
      .container {
        background-image: url('assets/bg-desktop.jpg');
        padding: 40px 40px 40px 40px;
      }
    }

    /* Header & Gecentreerd Logo */
    .header {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 5px;
    }

    .logo {
      height: 38px;
      width: auto;
      display: block;
    }

    /* Top Right Navigatie (Desktop) */
    .top-right-nav {
      position: absolute;
      top: 30px;
      right: 32px;
      z-index: 10;
      display: none;
      align-items: center;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .top-right-nav {
        display: flex;
        right: 40px;
      }
    }

    .clients-link {
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }

    .clients-link:hover {
      opacity: 1;
    }

    /* Ultra-Minimalistische Taalkiezer (Puur Tekst) */
    .lang-container {
      position: relative;
    }

    .lang-active-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 12px;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      opacity: 0.85;
      transition: opacity 0.2s ease;
      padding: 0;
    }

    .lang-active-btn:hover {
      opacity: 1;
    }

    .lang-active-btn::after {
      content: '▾';
      font-size: 9px;
    }

    /* Vrij zwevende lijst zonder kaders of glassmorphic vlakken */
    .lang-menu {
      position: absolute;
      top: 100%;
      right: 0;
      padding-top: 12px;
      display: none;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      background: transparent;
    }

    .lang-menu.open {
      display: flex;
    }

    .lang-option {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 11px;
      letter-spacing: 1.5px;
      cursor: pointer;
      opacity: 0.5;
      transition: all 0.2s ease;
      padding: 0;
      text-align: right;
    }

    .lang-option:hover, .lang-option.selected {
      opacity: 1;
      font-weight: 600;
    }

    /* Hamburgermenu Knop (Mobiel) */
    .hamburger-btn {
      position: absolute;
      top: 32px;
      right: 28px;
      z-index: 20;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
    }

    @media (min-width: 768px) {
      .hamburger-btn {
        display: none;
      }
    }

    .hamburger-line {
      width: 22px;
      height: 1px;
      background-color: #ffffff;
      transition: all 0.3s ease;
    }

    /* Mobile Minimal Overlay Menu */
    .mobile-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.88);
      z-index: 15;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .mobile-menu.open {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-clients-link {
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding-bottom: 20px;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .mobile-lang-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px 40px;
      text-align: center;
    }

    .mobile-lang-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 14px;
      letter-spacing: 2px;
      cursor: pointer;
      opacity: 0.5;
      padding: 4px 8px;
    }

    .mobile-lang-btn.selected {
      opacity: 1;
      font-weight: 600;
    }

    /* Midden Content */
    .content-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 100%;
      margin: auto 0;
    }

    /* Introductietekst */
    .intro-text {
      font-size: 28px;
      font-weight: 300;
      line-height: 1.5;
      letter-spacing: -0.2px;
      color: #ffffff;
      text-align: center;
      padding: 0 10px;
    }

    @media (min-width: 768px) {
      .content-center {
        max-width: 480px;
      }
      .intro-text {
        font-size: 14px;
        font-weight: 400;
        line-height: 1.7;
        letter-spacing: 0.2px;
        padding: 0;
      }
    }

    /* Footer Adres */
    .footer-address {
      font-size: 12.5px;
      font-weight: 400;
      letter-spacing: 0.4px;
      color: rgba(255, 255, 255, 0.85);
      text-align: center;
      line-height: 1.6;
    }

    .footer-address span {
      display: block;
    }

    @media (min-width: 768px) {
      .footer-address {
        font-size: 12px;
      }
      .footer-address span {
        display: inline;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Top Right Navigatie (Desktop) -->
    <div class="top-right-nav">
      <a href="#clients" class="clients-link">clients</a>

      <div class="lang-container">
        <button class="lang-active-btn" id="lang-btn" onclick="toggleLangMenu()">EN</button>
        <div class="lang-menu" id="lang-menu">
          <button class="lang-option" onclick="selectLanguage('en')">EN</button>
          <button class="lang-option" onclick="selectLanguage('fr')">FR</button>
          <button class="lang-option" onclick="selectLanguage('it')">IT</button>
          <button class="lang-option" onclick="selectLanguage('de')">DE</button>
          <button class="lang-option" onclick="selectLanguage('es')">ES</button>
          <button class="lang-option" onclick="selectLanguage('zh')">ZH</button>
          <button class="lang-option" onclick="selectLanguage('ja')">JA</button>
          <button class="lang-option" onclick="selectLanguage('ko')">KO</button>
        </div>
      </div>
    </div>

    <!-- Hamburgermenu Knop (Mobiel) -->
    <button class="hamburger-btn" id="hamburger-btn" onclick="toggleMobileMenu()" aria-label="Menu">
      <div class="hamburger-line"></div>
      <div class="hamburger-line"></div>
    </button>

    <!-- Mobiel Menu Overlay -->
    <div class="mobile-menu" id="mobile-menu">
      <a href="#clients" class="mobile-clients-link" onclick="toggleMobileMenu()">Clients</a>
      <div class="mobile-lang-grid">
        <button class="mobile-lang-btn" onclick="selectLanguage('en')">EN</button>
        <button class="mobile-lang-btn" onclick="selectLanguage('fr')">FR</button>
        <button class="mobile-lang-btn" onclick="selectLanguage('it')">IT</button>
        <button class="mobile-lang-btn" onclick="selectLanguage('de')">DE</button>
        <button class="mobile-lang-btn" onclick="selectLanguage('es')">ES</button>
        <button class="mobile-lang-btn" onclick="selectLanguage('zh')">ZH</button>
        <button class="mobile-lang-btn" onclick="selectLanguage('ja')">JA</button>
        <button class="mobile-lang-btn" onclick="selectLanguage('ko')">KO</button>
      </div>
    </div>

    <!-- Header -->
    <header class="header">
      <img src="1O1V-signage-light.png" alt="1O1V Logo" class="logo">
    </header>

    <!-- Midden Content -->
    <main class="content-center">
      <div class="intro-text" id="intro-text">
        <!-- Dynamisch geladen via JS -->
      </div>
    </main>

    <!-- Footer Adres -->
    <footer class="footer-address" id="footer-address">
      <span>1O1V Bahnhofstraße 10,</span> <span>8001 Zürich, Switzerland</span>
    </footer>

  </div>

  <script>
    const translations = {
      en: {
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 Zürich, Switzerland</span>",
        text: "1O1V is built to preserve and protect exceptional creativity and craftsmanship for verified collectors, behind a closed door."
      },
      fr: {
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 Zurich, Suisse</span>",
        text: "1O1V est conçu pour préserver et protéger une créativité et un savoir-faire d'exception pour des collectionneurs vérifiés, derrière une porte close."
      },
      it: {
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 Zurigo, Svizzera</span>",
        text: "1O1V è nato per preservare e proteggere la creatività e la maestria artigianale d'eccezione per collezionisti verificati, a porte chiuse."
      },
      de: {
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 Zürich, Schweiz</span>",
        text: "1O1V wurde geschaffen, um außergewöhnliche Kreativität und Handwerkskunst für verifizierte Sammler hinter verschlossener Tür zu bewahren und zu schützen."
      },
      es: {
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 Zúrich, Suiza</span>",
        text: "1O1V está creado para preservar y proteger la creatividad y artesanía excepcionales para coleccionistas verificados, tras una puerta cerrada."
      },
      zh: {
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 苏黎世, 瑞士</span>",
        text: "1O1V 旨在为经过验证的收藏家保护与传承非凡的创意与卓越工艺，尽在闭门之后。"
      },
      ja: {
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 チューリッヒ, スイス</span>",
        text: "1O1Vは、認証されたコレクターのために、非公開の場所で特別な創造性と職人技を保存・保護するために作られています。"
      },
      ko: {
        address: "<span>1O1V Bahnhofstraße 10,</span> <span>8001 취리히, 스위스</span>",
        text: "1O1V는 검증된 수집가를 위해 닫힌 문 뒤에서 특별한 창의성과 장인 정신을 보존하고 보호하기 위해 설립되었습니다."
      }
    };

    function toggleLangMenu() {
      document.getElementById('lang-menu').classList.toggle('open');
    }

    function toggleMobileMenu() {
      document.getElementById('mobile-menu').classList.toggle('open');
    }

    function selectLanguage(lang) {
      const data = translations[lang] || translations.en;
      
      document.getElementById('intro-text').innerText = data.text;
      document.getElementById('footer-address').innerHTML = data.address;
      document.getElementById('lang-btn').innerText = lang.toUpperCase();

      document.querySelectorAll('.lang-option').forEach(btn => {
        btn.classList.toggle('selected', btn.innerText.toLowerCase() === lang);
      });

      document.querySelectorAll('.mobile-lang-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.innerText.toLowerCase() === lang);
      });

      document.getElementById('lang-menu').classList.remove('open');
      document.getElementById('mobile-menu').classList.remove('open');
    }

    document.addEventListener('click', function(e) {
      const container = document.querySelector('.lang-container');
      if (container && !container.contains(e.target)) {
        document.getElementById('lang-menu').classList.remove('open');
      }
    });

    const userLang = (navigator.language || navigator.userLanguage).slice(0, 2).toLowerCase();
    selectLanguage(translations[userLang] ? userLang : 'en');
  </script>

</body>
</html>
