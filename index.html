<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1O1V</title>
  
  <!-- Gouden Bolletje Favicon (PNG) -->
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <style>
    /* Reset & Basisinstellingen */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      height: 100dvh;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    /* Container met Achtergrond (Standaard Mobiel) */
    .container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100%;
      min-height: 100dvh;
      padding: 35px 20px calc(35px + env(safe-area-inset-bottom)) 20px;
      background-image: url('assets/bg-mobile.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Desktop Achtergrond via Media Query */
    @media (min-width: 768px) {
      .container {
        background-image: url('assets/bg-desktop.jpg');
        padding: 60px 20px 40px 20px;
      }
    }

    /* Logo bovenaan */
    .logo-container {
      margin-top: 5px;
    }

    .logo {
      height: 48px;
      width: auto;
      display: block;
    }

    @media (min-width: 768px) {
      .logo {
        height: 55px;
      }
    }

    /* Midden Sectie (Formulier + Beschrijving) */
    .content-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 340px;
    }

    /* Input Sectie */
    .key-form {
      display: flex;
      align-items: center;
      width: 100%;
      margin-bottom: 25px;
    }

    .key-label {
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.5px;
      margin-right: 15px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    }

    .key-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.8);
      color: #ffffff;
      font-size: 16px;
      padding: 4px 0;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .key-input:focus {
      border-bottom-color: #ffffff;
    }

    /* Beschrijvende Tekst in het midden - Geoptimaliseerd voor Mobiel */
    .intro-text {
      font-size: 13.5px;
      font-weight: 400;
      line-height: 1.6;
      letter-spacing: 0.2px;
      color: rgba(255, 255, 255, 0.92);
      text-align: center;
      max-width: 92%;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    }

    .intro-text p {
      margin-bottom: 10px;
    }

    .intro-text p:last-child {
      margin-bottom: 0;
    }

    @media (min-width: 768px) {
      .intro-text {
        font-size: 14px;
        line-height: 1.7;
        max-width: 100%;
      }
    }

    /* Adres onderaan - Geoptimaliseerd voor Mobiel */
    .footer-address {
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.4px;
      color: #ffffff;
      text-align: center;
      line-height: 1.5;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    .footer-address span {
      display: block; /* Opsplitsen op mobiel */
    }

    @media (min-width: 768px) {
      .footer-address {
        font-size: 12px;
        font-weight: 400;
      }
      .footer-address span {
        display: inline; /* 1 regel op desktop */
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Logo -->
    <div class="logo-container">
      <img src="1O1V-signage-light.png" alt="1O1V Logo" class="logo">
    </div>

    <!-- Midden Content (Input + Introductie) -->
    <div class="content-center">
      <form class="key-form" onsubmit="event.preventDefault();">
        <label for="key" class="key-label">key</label>
        <input type="password" id="key" name="key" class="key-input" autocomplete="off" autofocus>
      </form>

      <div class="intro-text">
        <p>1O1V is built to preserve and protect exceptional craftsmanship.</p>
        <p>No algorithms, no public feeds, no instant replication. Only verified collectors, behind a closed door.</p>
      </div>
    </div>

    <!-- Footer Adres -->
    <div class="footer-address">
      <span>1O1V Bahnhofstraße 10,</span> <span>8001 Zürich, Switzerland</span>
    </div>

  </div>

</body>
</html>
